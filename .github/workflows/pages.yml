# Build the dot map (Census downloads -> dots -> tiles -> pages) and publish
# site/ to GitHub Pages. Tiles are generated here, never committed.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
#
# Tiles on Cloudflare R2 (needed once the site outgrows GitHub Pages' 1 GB):
# in repo Settings -> Secrets and variables -> Actions, add
#   secrets:   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  (R2 API token, Object Read & Write)
#   variables: R2_ENDPOINT  https://<account-id>.r2.cloudflarestorage.com
#              R2_BUCKET    opendotmap
#              TILES_URL    public URL of tiles.pmtiles, e.g. https://pub-<id>.r2.dev/tiles.pmtiles
# With TILES_URL set, builds upload tiles.pmtiles to R2 and publish only the
# pages to GitHub Pages.
name: Build and publish site

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      tiles:
        description: "Tile format to publish"
        type: choice
        options: [auto, r2, pmtiles, folder]
        default: auto

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older build.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # r2: upload tiles.pmtiles to Cloudflare R2 and publish only the pages.
  # pmtiles: publish the single file on GitHub Pages (needs range requests).
  # folder: publish the PNG folder on GitHub Pages (works on any host).
  # auto (push builds): r2 when the TILES_URL variable is set, else pmtiles.
  TILES: ${{ (inputs.tiles && inputs.tiles != 'auto') && inputs.tiles || (vars.TILES_URL && 'r2' || 'pmtiles') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Samples disk, memory, and CPU every 10 s for capacity planning; the
      # log is attached to the run as the "resource-usage" artifact.
      - name: Start resource monitor
        run: |
          { echo "cpus: $(nproc)"; free -h; df -h "$GITHUB_WORKSPACE"; } | tee "$RUNNER_TEMP/runner-specs.txt"
          echo setup > /tmp/opendots-phase
          nohup pipeline/monitor.sh "$RUNNER_TEMP/resource-usage.csv" 10 >/dev/null 2>&1 &

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Census files (~3 GB for the 11 western states) rarely change; cache them so
      # each build doesn't download them again.
      - name: Cache Census downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: census-${{ hashFiles('pipeline/config.py', 'pipeline/download.py') }}

      - name: Set up Python environment
        run: echo setup > /tmp/opendots-phase && make setup

      - name: Download Census data
        run: echo download > /tmp/opendots-phase && make data

      - name: Place dots
        run: echo dots > /tmp/opendots-phase && make dots

      - name: Render tiles
        run: echo tiles > /tmp/opendots-phase && make tiles

      - name: Build pages
        run: echo site > /tmp/opendots-phase && make site

      - name: Upload tiles to R2
        if: env.TILES == 'r2'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp site/tiles.pmtiles "s3://${{ vars.R2_BUCKET }}/tiles.pmtiles" \
            --endpoint-url "${{ vars.R2_ENDPOINT }}" \
            --content-type application/octet-stream --only-show-errors

      - name: Choose tile format
        env:
          TILES_URL: ${{ vars.TILES_URL }}
        run: |
          if [ "$TILES" = "r2" ]; then
            # The commit id in the URL makes browsers fetch the new file after each upload.
            url="$TILES_URL?v=${GITHUB_SHA::7}"
            sed -i "s|^  tiles: \"tiles/{z}/{x}/{y}.png\",|  tiles: \"$url\",|" site/assets/config.js
            grep -qF "  tiles: \"$url\"," site/assets/config.js
            rm -rf site/tiles site/tiles.pmtiles
          elif [ "$TILES" = "pmtiles" ]; then
            sed -i 's|^  tiles: "tiles/{z}/{x}/{y}.png",|  tiles: "tiles.pmtiles",|' site/assets/config.js
            grep -q '^  tiles: "tiles.pmtiles",' site/assets/config.js
            rm -rf site/tiles
          else
            rm -f site/tiles.pmtiles
          fi
          rm -rf site/templates
          du -sh site

      - name: Resource usage summary
        if: always()
        run: |
          echo done > /tmp/opendots-phase
          sleep 11
          pkill -f pipeline/monitor.sh || true
          awk -F, 'NR > 1 {
              p = $3; if (!(p in seen)) { seen[p] = 1; order[++n] = p }
              if ($4 > disk[p]) disk[p] = $4
              m = $6 - $7; if (m > mem[p]) mem[p] = m
              if ($8 > load[p]) load[p] = $8
              if ($9 > raw[p]) raw[p] = $9; if ($10 > work[p]) work[p] = $10; if ($11 > site[p]) site[p] = $11
              last[p] = $2; if (!(p in first)) first[p] = $2
            } END {
              printf "%-9s %7s %10s %9s %6s %9s %9s %9s\n", "step", "secs", "disk GB", "mem GB", "load", "raw GB", "work GB", "site GB"
              for (i = 1; i <= n; i++) { p = order[i]
                printf "%-9s %7d %10.2f %9.2f %6.1f %9.2f %9.2f %9.2f\n", p, last[p] - first[p], disk[p]/1048576, mem[p]/1048576, load[p], raw[p]/1048576, work[p]/1048576, site[p]/1048576 }
            }' "$RUNNER_TEMP/resource-usage.csv" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save resource usage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-usage
          path: |
            ${{ runner.temp }}/resource-usage.csv
            ${{ runner.temp }}/runner-specs.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
