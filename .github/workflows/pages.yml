# Build the dot map (Census downloads -> dots -> tiles -> pages) and publish
# site/ to GitHub Pages. Tiles are generated here, never committed.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Build and publish site

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      tiles:
        description: "Tile format to publish"
        type: choice
        options: [pmtiles, folder]
        default: pmtiles

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older build.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # pmtiles: one ~128 MB file, needs HTTP range requests (GitHub Pages supports
  # them). folder: ~24k small PNGs, works on any host. Push builds use pmtiles;
  # run the workflow manually to pick folder instead.
  TILES: ${{ inputs.tiles || 'pmtiles' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Census files (~470 MB for California) rarely change; cache them so
      # each build doesn't download them again.
      - name: Cache Census downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: census-${{ hashFiles('pipeline/config.py', 'pipeline/download.py') }}

      - name: Set up Python environment
        run: make setup

      - name: Download Census data
        run: make data

      - name: Place dots
        run: make dots

      - name: Render tiles
        run: make tiles

      - name: Build pages
        run: make site

      - name: Choose tile format
        run: |
          if [ "$TILES" = "pmtiles" ]; then
            sed -i 's|^  tiles: "tiles/{z}/{x}/{y}.png",|  tiles: "tiles.pmtiles",|' site/assets/config.js
            grep -q '^  tiles: "tiles.pmtiles",' site/assets/config.js
            rm -rf site/tiles
          else
            rm -f site/tiles.pmtiles
          fi
          rm -rf site/templates
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
